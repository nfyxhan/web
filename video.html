<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Video Frames</title>
    <script src="./static/ffmpeg.min.js"></script>
</head>

<body>
    <div>
        字符集
        <textarea id="allChars">abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_-+=>?/\|{}[]~`/></textarea>
        <select id="split" type="text">
            <option label="无" value="">
            </option>
            <option label="空格" value=" ">
            </option>
            <option label="," value=",">
            </option>
        </select>
        <button onclick="setChars()">重设</button>
    </div>
    <div>
        <canvas id="canvas3" width="720" height="100"></canvas>
    </div>
    <div>
        开始位置<input type="number" id="startAt" value="0">秒
        截取长度<input type="number" id="duration" value="5">秒
        帧率<input type="number" id="fpsNum" value="10">
    </div>
    <div>
        字体大小<input type="number" id="fontSize" value="20">
    </div>
    <div>
        背景颜色<input type="text" id="backgroundColor" value="white">
        像素颜色<input type="text" id="fontColor" value="black">
    </div>
    <div>
        <input type="file" id="videoUpload" accept="video/*">
        <button onclick="extractFramesWithFfmpeg()">转换</button>
        <a id="downloadLink" hidden>下载</a>
    </div>
    <div>
        <span id="videoInfo"> </span>
        <span id="progress"></span>
    </div>
    <video id="video" width="720" height="1280" controls hidden>
        <!-- <source src="input.mp4" type="video/mp4"> -->
        Your browser does not support the video tag.
    </video>
    <div>
        <canvas id="originImage"></canvas>
        <canvas id="resizedImage" hidden></canvas>
        <canvas id="pixImage"></canvas>
    </div>
    <script>
        const video = document.getElementById('video');
        let file = null

        document.getElementById('videoUpload').addEventListener('change', async function(event) {
            file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                video.addEventListener('loadedmetadata', function(e) {
                    document.getElementById('duration').value = video.duration;
                })
                // video.onload = () => {
                //     // extractFrames()
                //     console.log(video)
                //     // videoInfo = JSON.stringify(video)
                //     document.getElementById("videoInfo").innerText = videoInfo
                // }
                video.src = fileURL;
                video.load();
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.hidden = true;
            }
        });

        async function showImage(id, image) {
            const canvas = document.getElementById(id);
            if (!canvas) {
                return
            }
            let width = image.width
            let height = image.height
            canvas.width = 300
            canvas.height = canvas.width / width * height
            const ctx = canvas.getContext('2d');
            try {
                ctx.drawImage(image, 0, 0, width, height);
            } catch (e) {
                // image = await resize(image, canvas.width, canvas.height)
                ctx.putImageData(image, 0, 0)
            }
        }

        async function extractFramesWithFfmpeg() {
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.hidden = true;
            let start = new Date().getTime()
            let ffmpeg = new FFmpegWASM.FFmpeg();
            ffmpeg.on('progress', ({
                progress,
                time
            }) => {
                let now = new Date().getTime()
                updateProgress(`提取中`, progress, now - start);
            });
            await ffmpeg.load({
                coreURL: `./ffmpeg-core.js`,
                wasmURL: `./ffmpeg-core.wasm`,
                workerURL: `./ffmpeg-core.worker.js`
            });
            try {
                let data = await new Promise((resolve) => {
                    const blob = new Blob([file], {
                        type: file.type
                    });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        resolve(new Uint8Array(reader.result));
                    };
                    reader.readAsArrayBuffer(blob);
                });
                await ffmpeg.writeFile('input.mp4', data);
            } catch (e) {
                console.log(e)
            }
            let startAt = document.getElementById("startAt").value
            let duration = document.getElementById("duration").value
            if (duration <= 0) {
                duration = 5
            }
            let fps = document.getElementById("fpsNum").value
            await ffmpeg.exec(["-ss", `${startAt}`, "-t", `${duration}`, '-i', 'input.mp4', '-vf', `fps=${fps}`, 'frame_%03d.png']);

            const frames = [];
            for (let i = 1; i <= duration * fps; i++) {
                try {
                    const data = await ffmpeg.readFile(`frame_${String(i).padStart(3, '0')}.png`);
                    let frame = await imageFileToData(data)
                    let font = document.getElementById('fontSize').value
                    let frame2 = await resize(frame, frame.width / font, frame.height / font)
                    let now = new Date().getTime()
                    updateProgress("解析中", i / (duration * fps), now - start)
                    frames.push(frame2);
                } catch {
                    break;
                }
            }
            if (frames.length != 0) {
                saveVideo(frames, fps);
            }
        }

        function updateProgress(s, progress, time) {
            document.getElementById('progress').innerHTML = `${s} ${(progress*100).toFixed(2)}% (耗时: ${(time)/1000} s)`;
        }

        function imageFileToData(data) {
            return new Promise((resolve) => {
                const image = new Image();
                image.onload = () => {
                    let width = image.width
                    let height = image.height
                    const canvas = document.createElement('canvas');
                    canvas.width = width
                    canvas.height = height
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(image, 0, 0, width, height);
                    let frame = ctx.getImageData(0, 0, width, height)
                    resolve(frame)
                }
                image.src = URL.createObjectURL(new Blob([data.buffer], {
                    type: 'image/jpeg'
                }))
            })
        }

        async function saveVideo(frames, fps) {
            if (frames.length === 0) {
                alert('No frames to save.');
                return;
            }
            let start = new Date().getTime()
            let ffmpeg = new FFmpegWASM.FFmpeg();
            ffmpeg.on('progress', ({
                progress,
                time
            }) => {
                updateProgress(`视频生成中`, progress, new Date().getTime() - start);
            });
            await ffmpeg.load({
                coreURL: `./ffmpeg-core.js`,
                wasmURL: `./ffmpeg-core.wasm`,
                workerURL: `./ffmpeg-core.worker.js`
            });

            // Write frames to ffmpeg's virtual file system
            for (let i = 0; i < frames.length; i++) {
                let frame2 = frames[i];
                let frame3 = await imageDataToPixImage(frame2);
                const response = await imageDataToPng(frame3)
                ffmpeg.writeFile(`frame_${i.toString().padStart(3, '0')}.png`, response);
                updateProgress(`字符转换中`, (i + 1) / frames.length, new Date().getTime() - start);
            }

            // Run ffmpeg command to compile frames into a video
            await ffmpeg.exec([
                '-framerate', `${fps}`, // Set frame rate to 30 fps
                '-i', 'frame_%03d.png', // Input pattern for frames
                '-c:v', 'libx264', // Video codec
                '-pix_fmt', 'yuv420p', // Pixel format
                'output.mp4' // Output video file
            ]);

            // Read the output video file
            const data = await ffmpeg.readFile('output.mp4');
            // Create a Blob and download link
            const blob = new Blob([data.buffer], {
                type: 'video/mp4'
            });
            const url = URL.createObjectURL(blob);

            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = 'output.mp4';
            downloadLink.hidden = false;
        }

        function imageDataToPng(imageData) {
            const canvas = document.createElement('canvas');
            canvas.width = imageData.width;
            canvas.height = imageData.height;
            const ctx = canvas.getContext('2d');
            ctx.putImageData(imageData, 0, 0);
            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        resolve(new Uint8Array(reader.result));
                    };
                    reader.readAsArrayBuffer(blob);
                }, 'image/png');
            });
        }
        var all = ''

        async function setChars() {
            let split = document.getElementById('split').value
            let allChars = document.getElementById('allChars').value
            all = await sortChars(allChars.split(split))
        }

        async function sortChars(chars) {
            let font = document.getElementById('fontSize').value
            const canvas = document.getElementById('canvas3');
            let ctx = canvas.getContext('2d');
            ctx.width = font * chars.length;
            ctx.height = font;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, font * chars.length, font);
            ctx.fillStyle = 'black';
            ctx.font = font + 'px Arial';
            for (let i = 0; i < chars.length; i++) {
                let t = chars[i]
                ctx.fillText(t, i * font, font, font)
            }
            let imageData = ctx.getImageData(0, 0, font * chars.length, font)
            let vv = []
            for (let i = 0; i < chars.length; i++) {
                let g = 0
                for (j = 0; j < font; j++) {
                    for (k = 0; k < font; k++) {
                        let idx = (k * font * chars.length + i * font + j) * 4
                        let rgb = [imageData.data[idx], imageData.data[idx + 1], imageData.data[idx + 2], imageData.data[idx + 3]]
                        g += rgbaToGrayscale(rgb)
                    }
                }
                vv.push({
                    k: g,
                    v: i
                })
            }
            let v2 = vv.sort((a, b) => a.k - b.k)
            let res = []
            for (i = 0; i < v2.length; i++) {
                let t = chars[v2[i].v]
                res.push(t)
                ctx.fillText(t, i * font, font * 2, font)
            }
            return res
        }

        function rgbaToGrayscale(data, bg_r = 255, bg_g = 255, bg_b = 255) {
            let i = 0
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const a = data[i + 3];
            blended_r = (r * a + bg_r * (255 - a)) / 255
            blended_g = (g * a + bg_g * (255 - a)) / 255
            blended_b = (b * a + bg_b * (255 - a)) / 255
            grayscale = 0.299 * blended_r + 0.587 * blended_g + 0.114 * blended_b
            return parseInt(grayscale)
        }

        function rgbToGray(v) {
            return parseInt(0.299 * v[0] + 0.587 * v[1] + 0.114 * v[2])
        }

        function rgbToHex(color) {
            // 将每个颜色值转换为两位的十六进制字符串
            let r = color[0]
            let g = color[1]
            let b = color[2]
            let a = color[3]
            let hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            // return hex;
            return `rgba(${r}, ${g}, ${b}, ${a})`
        }

        async function imageDataToPixImage(imageData) {
            let font = document.getElementById('fontSize').value
            let width = imageData.width * font,
                height = imageData.height * font
            let rgbValues = getImageRGB(imageData)
            let textContent = convertRGBToText(rgbValues)
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = document.getElementById('backgroundColor').value
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = document.getElementById('fontColor').value
            ctx.font = font + 'px Arial';
            for (let i = 0; i < height / font; i++) {
                for (let j = 0; j < width / font; j++) {
                    let index = i * width / font + j
                    if (index >= textContent.length) {
                        continue
                    }
                    let t = textContent[index]
                    ctx.fillStyle = rgbToHex(rgbValues[index])
                    ctx.fillText(t, j * font, i * font + 0.5 * font, font)
                }
            }
            imageData = ctx.getImageData(0, 0, width, height)
            showImage("pixImage", imageData)
            return imageData
        }

        function convertRGBToText(rgbValues) {
            let textContent = ''
            for (let i = 0; i < rgbValues.length; i++) {
                let index = parseInt(rgbaToGrayscale(rgbValues[i]) / 255 * all.length)
                if (index >= all.length) {
                    index = all.length - 1
                }
                textContent += '' + all[index]
            }
            return textContent
        }

        async function resize(imageData, width, height, keepAspectRatio = true) {
            return new Promise((resolve, reject) => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = imageData.width;
                    canvas.height = imageData.height;
                    const ctx = canvas.getContext('2d');
                    ctx.putImageData(imageData, 0, 0);
                    let dataURL = canvas.toDataURL('image/png');
                    const img = new Image();
                    img.onload = () => {
                        let canvasWidth = width;
                        let canvasHeight = height;
                        let offsetX = 0;
                        let offsetY = 0;

                        if (keepAspectRatio) {
                            const aspectRatio = img.width / img.height;
                            if (width / height > aspectRatio) {
                                canvasWidth = height * aspectRatio;
                                offsetX = (width - canvasWidth) / 2;
                            } else {
                                canvasHeight = width / aspectRatio;
                                offsetY = (height - canvasHeight) / 2;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        backgroundColor = 'white'
                        ctx.fillStyle = backgroundColor;
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, offsetX, offsetY, canvasWidth, canvasHeight);
                        const resizedImageData = ctx.getImageData(0, 0, width, height);
                        resolve(resizedImageData);
                    };
                    img.onerror = () => {
                        reject(new Error('Failed to load image'));
                    };
                    img.src = dataURL;
                } catch (error) {
                    reject(error);
                }
            });
        }

        function getImageRGB(imageData) {
            const data = imageData.data;
            const rgbValues = [];
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];
                rgbValues.push([r, g, b, a]);
            }
            return rgbValues
        }

        async function init() {
            await setChars(all)
        }

        init()

    </script>
</body>

</html>
