        var subtle = crypto.subtle

        async function uploadFiles() {
            const fileInput = document.getElementById('file');
            const files = fileInput.files;
            if (files.length === 0) {
                alert('请选择要上传的文件');
                return;
            }

            const promises = [];
            const ss = [];

            let width = document.getElementById('width').value;
            let height = document.getElementById('height').value;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    let dataURL = await readFileAsDataURL(file);
                    dataURL = await resizeImage(dataURL, width, height)
                    ss.push(dataURL);
                } catch (error) {
                    console.error('Error reading file:', file.name, error);
                }
            }

            useGif(ss, width, height);
        }

        async function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    if (e.target && e.target.result) {
                        resolve(e.target.result);
                    } else {
                        reject(new Error('Failed to read file as data URL'));
                    }
                };
                reader.onerror = function () {
                    reject(new Error('Error reading file'));
                };
                reader.readAsDataURL(file);
            });
        }

        function resizeImage(dataURL, width, height, keepAspectRatio = true) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let canvasWidth = width;
                    let canvasHeight = height;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (keepAspectRatio) {
                        const aspectRatio = img.width / img.height;
                        if (width / height > aspectRatio) {
                            canvasWidth = height * aspectRatio;
                            offsetX = (width - canvasWidth) / 2;
                        } else {
                            canvasHeight = width / aspectRatio;
                            offsetY = (height - canvasHeight) / 2;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    backgroundColor = document.getElementById("backgoundcolor").value;
                    ctx.fillStyle = backgroundColor;
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, offsetX, offsetY, canvasWidth, canvasHeight);
                    resolve(canvas.toDataURL());
                };
                img.onerror = function () {
                    reject(new Error('Failed to load image'));
                };
                img.src = dataURL;
            });
        }

        async function text2image(text, width, height) {
            var canvasElement = document.createElement('canvas')
            var ctx = canvasElement.getContext('2d')
            ctx.canvas.width = width
            ctx.canvas.height = height
            ctx.fillStyle = document.getElementById("backgoundcolor").value
            ctx.fillRect(0, 0, width, height)
            ctx.fillStyle = document.getElementById("fontcolor").value
            fontSize = document.getElementById('fontSize').value
            font = document.getElementById('font').value
            ctx.font = fontSize + 'px ' + font
            console.log(ctx.font)
            mt = ctx.measureText(text)
            let tw = mt.width || 0
            if (tw > width) {
                tw = width
            }
            ctx.fillText(text, (width - tw) / 2, (height) / 2 + fontSize / 3, width);
            let dataUrl = ctx.canvas.toDataURL();
            mohu = document.getElementById('mohu').value / 100
            dataUrl = await resizeImage(dataUrl, width * mohu, height * mohu)
            dataUrl = await resizeImage(dataUrl, width, height)
            return dataUrl
        }

        async function addText(gif, text, width, height) {
            var image = document.createElement("img")
            let data = text
            if (text.indexOf("data:image") == -1) {
                data = await text2image(text, width, height)
            }
            image.src = data
            image.text = text
            let l = document.getElementById('log')
            l.appendChild(image)
            l.appendChild(document.createElement('br'))
            gif.addFrame(image, {
                delay: document.getElementById('interval').value
            });
        }

        function clipboardWrite(t, blob) {
            let type = 'text/plain'
            blob.type = type //'image/png'//t
            const data = [new ClipboardItem({
                [blob.type]: blob
            })];
            navigator.clipboard.write(data).then(
                () => {
                    /* success */
                    console.log("copy")
                },
                (e) => {
                    /* failure */
                    console.log(e)
                },
            );
        }

        async function useGif(texts, width, height) {
            document.getElementById('log').innerHTML = ''
            document.getElementById('image').innerHTML = ''
            document.getElementById('image').style.height = height + 'px'
            var gif = new GIF({
                // workers: 2,
                // quality: 10,
                width: width,
                height: height,
                workerScript: "./static/gif.worker.js",
            });
            for (var i = 0; i < texts.length; i++) {
                let text = texts[i]
                await addText(gif, text, width, height)
            }
            gif.on('finished', function (blob) {
                var reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onload = function (e) {
                    let img = document.getElementById('image');
                    let image = document.createElement('img')
                    image.src = e.target.result
                    img.appendChild(image)
                    generateSHA256Hash(texts.join('\n')).then(hash => {
                        let link = document.getElementById("download");
                        link.href = image.src
                        mohu = document.getElementById('mohu').value / 100
                        link.download = 'gif_' + width + 'x' + height + '_' + mohu + '_' + hash + '.gif';
                    });
                }
                // clipboardWrite('image/gif', blob)
            });
            gif.on('progress', function (progress) {
                document.querySelector("#prog").innerHTML = "进度: " + progress * 100 + '%';
            });
            gif.render()
        }

        async function generateSHA256Hash(message) {
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            if (!subtle) {
                return ""
            }
            const hashBuffer = await subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(byte => byte.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        function renderGif() {
            let width = document.getElementById('width').value
            let height = document.getElementById('height').value
            let ss = getAllText()
            useGif(ss, width, height)
        }

        function debug() {
            document.getElementById('log').hidden = !document.getElementById('debug').checked

        function updateColor() {

        function colorReverse(oldColor) {
            oldColor = 'Ox' + oldColor.replace(/#/g, '')
            let str = '000000' + ('OxFFFFFF' - oldColor).toString(16);
            return '#' + str.substring(str.length - 6, str.length);
        }

        function getAllText() {
            let text = document.getElementById('textInput').value
            text = text.replaceAll(',', '\n')
            text = text.replaceAll('.', '\n')
            text = text.replaceAll('，', '\n')
            text = text.replaceAll('。', '\n')
            let ss = text.split('\n')
            if (ss.length == 1) {
                tmp = '' + ss[0]
                for (i = 0; tmp.length < 10; i++) {
                    tmp = tmp + '' + ss[0]
                    ss.push(tmp)
                }
                for (i = ss.length - 1; i > 0; i--) {
                    ss.push(ss[i - 1])
                }
            }
            if (ss.length < 3) {
                ss.push('')
                ss.push('')
                ss.push('')
            }
            ss = ss.map(element => {
                return TextToEmoji(element).join('')
            });
            return ss
        }

        function setWidthHeightByText() {
            let ss = getAllText()
            var canvasElement = document.createElement('canvas')
            var tCtx = canvasElement.getContext('2d')
            let fontSize = document.getElementById('fontSize').value
            let font = document.getElementById('font').value
            let maxWidth = 0
            for (i = 0; i < ss.length; i++) {
                tCtx.font = 'normal normal normal ' + fontSize + 'px ' + font
                text = ss[i]
                mt = tCtx.measureText(text)
                if (mt.width > maxWidth) {
                    maxWidth = mt.width
                }
            }
            document.getElementById('width').value = maxWidth
            document.getElementById('height').value = parseInt(fontSize) + 10
        }
